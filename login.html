<section class="login-page">
    <div class="login-shell">
        <div class="info-panel">
            <div class="brand-wrap">
                <span class="brand">carSales</span>
            </div>

            <div class="info-copy">
                <h2>Seu próximo carro começa aqui.</h2>
                <p>
                    Acesse sua conta e descubra ofertas exclusivas, financiamientos inteligentes
                    e atendimento pensado para você.
                </p>
            </div>

            <div class="info-badges">
                <span>Segurança</span>
                <span>Agilidade</span>
                <span>Confiabilidade</span>
            </div>
        </div>

        <div class="form-panel">
            <div class="form-box">
                <div class="tab-switcher" role="tablist" aria-label="Tipos de acesso">
                    <button type="button" class="tab-button" [class.is-active]="activeTab === 'login'"
                        (click)="setTab('login')">
                        Login
                    </button>
                    <button type="button" class="tab-button" [class.is-active]="activeTab === 'register'"
                        (click)="setTab('register')">
                        Cadastrar cliente
                    </button>
                </div>

                <div *ngIf="activeTab === 'login'">
                    <span class="eyebrow">Bem-vindo</span>
                    <h1>Login</h1>

                    <form class="login-form" (ngSubmit)="onSubmit()">
                        <div class="field">
                            <label for="email">E-mail</label>
                            <input id="email" type="email" name="email" [(ngModel)]="email" placeholder="seu@email.com"
                                required />
                        </div>

                        <div class="field">
                            <label for="senha">Senha</label>
                            <input id="senha" type="password" name="senha" [(ngModel)]="senha"
                                placeholder="Digite sua senha" required />
                        </div>

                        <div class="meta">
                            <label class="remember-me">
                                <input type="checkbox" />
                                <span>Lembrar-me</span>
                            </label>
                            <a href="#">Esqueceu a senha?</a>
                        </div>

                        <button type="submit">Entrar</button>
                    </form>

                    <div class="divider"><span>ou continue com</span></div>

                    <div class="socials">
                        <button type="button" class="social-btn google">G</button>
                        <button type="button" class="social-btn facebook">f</button>
                        <button type="button" class="social-btn apple"></button>
                    </div>
                </div>

                <div *ngIf="activeTab === 'register'">
                    <span class="eyebrow">Novo cliente</span>
                    <h1>Cadastro</h1>

                    <form class="login-form register-form" (ngSubmit)="onRegisterSubmit()">
                        <div class="field">
                            <label for="nome">Nome</label>
                            <input id="nome" type="text" name="nome" [(ngModel)]="nome"
                                placeholder="Digite seu nome completo" required />
                        </div>

                        <div class="field">
                            <label for="telefone">Telefone</label>
                            <input id="telefone" type="tel" name="telefone" [(ngModel)]="telefone"
                                placeholder="(11) 99999-9999" required />
                        </div>

                        <div class="field">
                            <label for="cadastroEmail">E-mail</label>
                            <input id="cadastroEmail" type="email" name="cadastroEmail" [(ngModel)]="cadastroEmail"
                                placeholder="seu@email.com" required />
                        </div>

                        <div class="field">
                            <label for="cadastroSenha">Senha</label>
                            <input id="cadastroSenha" type="password" name="cadastroSenha" [(ngModel)]="cadastroSenha"
                                placeholder="Crie uma senha" required />
                        </div>

                        <div class="field">
                            <label for="confirmarSenha">Confirmar senha</label>
                            <input id="confirmarSenha" type="password" name="confirmarSenha"
                                [(ngModel)]="confirmarSenha" placeholder="Repita a senha" required />
                        </div>

                        <div *ngIf="registerMessage" class="message" [class.error-message]="registerError"
                            [class.success-message]="!registerError">
                            {{ registerMessage }}
                        </div>

                        <button type="submit">Cadastrar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
